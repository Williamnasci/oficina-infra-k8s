name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.11.4"
  AWS_REGION: "us-east-1"

jobs:
  validate:
    name: Format, validate and plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # AWS Academy Learner Lab so fornece credenciais de sessao temporarias
      # (expiram com a sessao do lab, ~4h) - sem usuario IAM permanente
      # possivel (iam:CreateUser e negado pelo LabRole). AWS_SESSION_TOKEN
      # precisa ser atualizado nos secrets do repo toda vez que uma nova
      # sessao de lab e iniciada (ver README).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color -input=false

  # Disparo manual (workflow_dispatch) apenas - AWS Academy Learner Lab nao
  # permite credencial IAM permanente, entao nao ha secret seguro pra deixar
  # o apply automatico em todo push/merge (a sessao expira em horas). Rode
  # manualmente ("gh workflow run terraform.yml" ou pela aba Actions) depois
  # de atualizar AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN
  # nos secrets com uma sessao de lab fresca.
  apply:
    name: Apply (manual)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # AWS Academy Learner Lab so fornece credenciais de sessao temporarias
      # (expiram com a sessao do lab, ~4h) - sem usuario IAM permanente
      # possivel (iam:CreateUser e negado pelo LabRole). AWS_SESSION_TOKEN
      # precisa ser atualizado nos secrets do repo toda vez que uma nova
      # sessao de lab e iniciada (ver README).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false

      # terraform apply retorna assim que a EC2 fica "running" na API da AWS -
      # isso leva segundos. O bootstrap real (user_data.sh.tpl: Docker,
      # kubectl, kind, criacao do cluster e so entao publicacao do kubeconfig
      # no Secrets Manager) leva minutos. Buscar o secret logo apos o apply
      # (sem esperar) e uma race: se a instancia foi RECRIADA, o secret ainda
      # contem o kubeconfig da instancia ANTERIOR (existe, entao uma checagem
      # ingenua de "o secret existe?" passaria mesmo estando desatualizado).
      # A checagem certa e comparar QUANDO o secret mudou pela ultima vez
      # contra QUANDO a instancia atual subiu - so aceitar um secret alterado
      # depois do LaunchTime garante que foi ESTA instancia que publicou.
      - name: Wait for cluster bootstrap to publish a fresh kubeconfig
        run: |
          set -euo pipefail

          INSTANCE_ID=$(terraform output -raw instance_id)
          LAUNCH_TIME=$(aws ec2 describe-instances \
            --region ${{ env.AWS_REGION }} \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].LaunchTime' --output text)
          LAUNCH_EPOCH=$(date -d "$LAUNCH_TIME" +%s)

          echo "Instancia $INSTANCE_ID, LaunchTime=$LAUNCH_TIME. Aguardando kubeconfig publicado apos esse instante..."

          TIMEOUT_SECONDS=600
          INTERVAL_SECONDS=15
          ELAPSED=0

          while true; do
            SECRET_CHANGED=$(aws secretsmanager describe-secret \
              --region ${{ env.AWS_REGION }} \
              --secret-id oficina/k8s/kubeconfig \
              --query 'LastChangedDate' --output text 2>/dev/null || echo "")

            if [ -n "$SECRET_CHANGED" ] && [ "$SECRET_CHANGED" != "None" ]; then
              SECRET_EPOCH=$(date -d "$SECRET_CHANGED" +%s)
              if [ "$SECRET_EPOCH" -ge "$LAUNCH_EPOCH" ]; then
                echo "kubeconfig atualizado em $SECRET_CHANGED (>= LaunchTime) - bootstrap desta instancia concluido."
                break
              fi
            fi

            if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
              echo "::error::Timeout de ${TIMEOUT_SECONDS}s esperando o bootstrap publicar um kubeconfig novo. A instancia pode ter falhado no user_data - ver /var/log/oficina-bootstrap.log via SSM Session Manager." >&2
              exit 1
            fi

            sleep "$INTERVAL_SECONDS"
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
          done

      - name: Fetch kubeconfig from Secrets Manager and push as GitHub secret to oficina-api
        env:
          GH_TOKEN: ${{ secrets.OFICINA_API_REPO_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "OFICINA_API_REPO_TOKEN nao configurado — pulei a atualizacao do KUBE_CONFIG no oficina-api. Faca manualmente (ver README)." >&2
            exit 0
          fi
          aws secretsmanager get-secret-value \
            --region ${{ env.AWS_REGION }} \
            --secret-id oficina/k8s/kubeconfig \
            --query SecretString --output text > kubeconfig
          gh secret set KUBE_CONFIG --repo Williamnasci/oficina-api < kubeconfig
          rm -f kubeconfig
